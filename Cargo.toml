[package]
name = "mldsa-verify"
version = "0.1.4"
edition = "2021"
description = "Verify-only ML-DSA-65 (FIPS 204) post-quantum signatures over a C ABI — a thin, embeddable RustCrypto wrapper for FFI."
license = "MIT OR Apache-2.0"
repository = "https://github.com/HelloHQ/mldsa-verify"
keywords = ["ml-dsa", "fips204", "post-quantum", "signature", "ffi"]
categories = ["cryptography", "api-bindings"]

[lib]
name = "mldsa_verify"
# staticlib → iOS/static linking; cdylib → desktop/Android shared lib; rlib → tests.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# RustCrypto ML-DSA (FIPS 204), ACVP-validated upstream. `zeroize` makes the
# signing key (seed and expanded key) wipe itself on drop; without it, signing
# would leave the secret in freed memory.
ml-dsa = { version = "0.1.1", features = ["zeroize"] }
# The 32 bytes of fresh randomness each hedged signature takes (FIPS 204
# Algorithm 2, `rnd`), read from the OS. `sys_rng` is the rand_core adapter
# ml-dsa's `sign_randomized` takes.
getrandom = { version = "0.4", features = ["sys_rng"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
# panic = unwind (default) so each FFI entry point's catch_unwind converts any
# panic into a "0" (failure) return instead of unwinding across the C boundary,
# and the signing key's zeroizing Drop still runs while it unwinds.

[dev-dependencies]
# Used only by examples/gen_vector.rs (test-vector generator).
base64 = "0.23.1"
